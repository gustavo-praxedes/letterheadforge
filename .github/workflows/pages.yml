name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html src data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # deploy-pages lists the run's artifacts right after the upload finishes and
      # the API sometimes lags by a second or two, answering "Found 0 artifact(s)"
      # for an artifact that uploaded fine. Wait until it is visible.
      - name: Wait for the artifact to appear
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then
              echo "artefato github-pages visível (tentativa $attempt)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::o artefato github-pages não ficou visível em 2 minutos"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
