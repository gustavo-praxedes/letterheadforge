name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp -r index.html src data vendor _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # deploy-pages asks the Pages service for the run's `github-pages` artifact
      # and the service can still answer "Found 0 artifact(s)" for a second or two
      # after the upload succeeded. Wait until our own API sees it, give the Pages
      # side a moment to catch up, and retry the deploy once if it still misses.
      - name: Wait for the artifact to appear
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 24); do
            count=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts" \
              --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "${count:-0}" -gt 0 ]; then
              echo "artefato github-pages visível (tentativa $attempt)"
              sleep 15
              exit 0
            fi
            sleep 5
          done
          echo "::error::o artefato github-pages não ficou visível em 2 minutos"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Give the Pages service another moment
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Fail when both attempts missed
        if: steps.deployment.outcome == 'failure' && steps.retry.outcome == 'failure'
        run: |
          echo "::error::a publicação no Pages falhou duas vezes"
          exit 1
